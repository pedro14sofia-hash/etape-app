<!DOCTYPE html>
<html lang="pt-BR" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFE566">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Étape Navegar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="map"></canvas>
<canvas id="rider" aria-hidden="true"></canvas>
<header id="top">
  <div id="stageCode" class="code"><span id="stageKey">E1</span><select id="stageSel" aria-label="Etapa"></select></div>
  <div class="name"><b id="stageName">–</b><span id="stageSub"></span></div>
  <div class="clock"><b id="clock">–:–</b><button id="btnTheme" aria-label="Tema">◐</button></div>
</header>
<div id="edge"></div>
<div id="cue" class="cue"></div>
<div id="ctl">
  <button id="zin" aria-label="Aproximar">+</button>
  <button id="zout" aria-label="Afastar">−</button>
  <button id="btnFollow" class="on" aria-label="Recentralizar em mim"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
  <button id="btnVoice" class="on" aria-label="Voz"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  <button id="btnBrief" aria-label="Prévia do dia"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18H5z"/><path d="M8 7h8M8 11h8M8 15h5"/><path d="M15 15l2 2 3-3" stroke-width="2.4"/></svg></button>
  <button id="btnCam" aria-label="Câmera: 2D, terceira ou primeira pessoa">2D</button>
  <button id="btnSat" aria-label="Satélite" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
  <button id="btnMode" aria-label="Recolher ou expandir o painel">▾</button>
</div>
<div id="attr">© OpenStreetMap contributors</div>
<div id="speedo" hidden>
  <div class="sp"><b id="spV">0</b><span>km/h</span></div>
  <div class="spx"><span id="spG" class="g">0 %</span></div>
</div>

<footer id="panel">
  <div id="grab" class="grab"></div>
  <div id="fixed" class="fixed">
    <div class="eta"><b id="eta">–:–</b><span>chegada · <i id="vsplan"></i></span></div>
    <div><b id="rem">–</b><span>km restam</span></div>
    <div class="btn"><button id="btnSession" class="sbtn idle">Iniciar<small>etapa</small></button></div>
  </div>
  <div id="next" class="next">
    <div class="nb"><em id="nbName">–</em><span id="nbSub"></span></div>
    <div class="tc"><span id="tcArrow"></span><div><span id="tcDist">–</span><small id="tcSub"></small></div></div>
  </div>
  <div id="tabs" class="tabs"><div data-tab="tele" class="on">Telemetria</div><div data-tab="fuel">Abastecer</div><div data-tab="prof">Perfil</div></div>

  <section class="pane" data-tab="tele">
    <div class="tele">
      <div><b><span id="tV">–</span><small>km/h</small></b><span>velocidade</span></div>
      <div><b><span id="tG">–</span><small>%</small></b><span>rampa agora</span></div>
      <div><b><span id="tDone">–</span><small>km</small></b><span>feitos</span></div>
      <div><b><span id="tVam">–</span><small>m/h</small></b><span>VAM 5 min</span></div>
      <div><b><span id="tEle">–</span><small>m</small></b><span>altitude</span></div>
      <div><b><span id="tUp">–</span><small>m</small></b><span>subida restante</span></div>
    </div>
    <div id="ctx" hidden></div>
  </section>
  <section class="pane" data-tab="fuel" hidden>
    <div class="fuel">
      <div class="row"><div class="lab">Água</div><div class="bar"><i id="fWBar"></i><em id="fWMark"></em></div><div class="val" id="fWv">–</div></div>
      <div class="row"><div class="lab">Carbo</div><div class="bar"><i id="fCBar"></i><em id="fCMark"></em></div><div class="val" id="fCv">–</div></div>
      <div class="row"><div class="lab">Sódio</div><div class="bar"><i id="fSBar"></i><em id="fSMark"></em></div><div class="val" id="fSv">–</div></div>
      <div class="acts"><button id="fDrink">Bebi<small>150 ml</small></button><button id="fEat">Comi<small>30 g</small></button><button id="fSnooze">Depois<small>+10 min</small></button></div>
      <div class="nxt" id="fNext"></div>
    </div>
  </section>
  <section class="pane" data-tab="prof" hidden>
    <div class="prof">
      <canvas id="prof"></canvas>
      <div class="terr" id="terr"></div>
      <div class="lg"><span><i class="a"></i>asfalto</span><span><i class="g"></i>gravel</span><span><i class="t"></i>trilha</span></div>
      <div class="ahead" id="pAhead"></div>
    </div>
  </section>

  <div class="mini ab" data-tab="tele" hidden>
    <div class="grow"><em id="mName">–</em><span id="mSub"></span></div>
    <div class="kv"><b><span id="mV">–</span><small id="mVu">m/h</small></b><span id="mVl">VAM</span></div>
    <div class="kv"><b><span id="mG">–</span><small id="mGu">m</small></b><span id="mGl">a subir</span></div>
  </div>
  <div class="mini fu" data-tab="fuel" hidden>
    <div><div class="l"><span>Água</span><b id="mWv">–</b><i id="mWn">–</i></div><div class="fbar"><i id="mWBar"></i><em id="mWMark"></em></div><div class="mini-acts"><button id="mDrink">Bebi</button></div></div>
    <div><div class="l"><span>Carbo</span><b id="mCv">–</b><i id="mCn">–</i></div><div class="fbar"><i id="mCBar"></i><em id="mCMark"></em></div><div class="mini-acts"><button id="mEat">Comi</button></div></div>
  </div>
  <div class="mini pr" data-tab="prof" hidden>
    <canvas id="spark" class="spark"></canvas>
    <div class="strip" id="mTerr"></div>
    <div class="cs" id="mProfTxt"></div>
  </div>

  <div class="foot"><span id="gpsSt"></span><span class="tools"><button id="btnSim">Sim</button><button id="btnReport">Relatório</button><button id="btnFinish">Encerrar</button><button id="btnReset">Zerar</button></span></div>
</footer>

<dialog id="dlgBrief"><div id="briefBody"></div><div class="dlg-acts"><button data-close class="pri">Vamos</button></div></dialog>
<dialog id="dlgPreview">
  <div class="pv-tabs" id="pvTabs"></div>
  <div id="pvBody"></div>
  <div class="dlg-acts"><button id="pvGo" class="pri">Navegar esta etapa</button><button data-close>Fechar</button></div>
</dialog>
<dialog id="dlgReport"><div id="repBody"></div><div class="dlg-acts"><button id="repShare" class="pri">Enviar resumo</button><button id="repGpx">GPX</button><button data-close>Fechar</button></div></dialog>

<script src="data.js"></script>
<script type="module" src="app.js"></script>
<noscript><div style="position:absolute;inset:0;background:#F7F5EE;padding:24px;font-family:sans-serif">O navegador precisa de JavaScript. Abra no Chrome.</div></noscript>
</body>
</html>
